<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Unordered List</title>
</head>
<body>
    <ul>
        <li>Fruits</li>
        <ul>
            <li>Apples</li>
            <li>Bananas</li>
            <li>Pears</li>
            <li>Oranges</li>
        </ul>
        <li>Vegetables</li>
        <ul>
            <li>Carrots</li>
            <li>Broccoli</li>
            <li>Spinach</li>
            <li>Peppers</li>
        </ul>
        <li>Cereals</li>
        <li>Nuts</li>
    </ul>
</body>
</html>
